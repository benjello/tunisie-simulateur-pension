[project]
name = "tunisie-simulateur-pension"
version = "0.1.0"
description = "Simulateur de pension de retraite pour la Tunisie, basé sur OpenFisca-Tunisia (package pension) et Shiny for Python"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Mahdi Ben Jelloul" }]
dependencies = [
    "shiny>=1.0",
    "openfisca-tunisia[pension]>=0.164",
    "openfisca-core[web-api]>=43",
    "httpx>=0.27",
    "pandas>=3.1.1",
    "matplotlib>=3.11.2",
]

[project.urls]
Homepage = "https://github.com/benjello/tunisie-simulateur-pension"
Repository = "https://github.com/benjello/tunisie-simulateur-pension"

[dependency-groups]
dev = [
    "pytest>=8",
    "rsconnect-python>=1.33.2",
]

[tool.uv]
# Le country-package des pensions est openfisca_tunisia_pension ; il exige numba
# (extra [pension] d'openfisca-tunisia).
